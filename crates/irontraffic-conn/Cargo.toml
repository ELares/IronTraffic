# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "irontraffic-conn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One SO_REUSEPORT socket per worker, converted into acceptors, with an explicit single-socket fallback."

[lints]
workspace = true

[dependencies]
# bind_listener, Caps, and SockOpts: the only way this crate ever touches a
# raw socket option.
irontraffic-io = { path = "../irontraffic-io", version = "0.1.0" }
# ListenerName, BindAddr, and Backlog: the validated newtypes bind() takes.
irontraffic-config = { path = "../irontraffic-config", version = "0.1.0" }
# core::with, Counter, and turn_tick: the accept loop's per-turn clock and
# counter seam.
irontraffic-runtime = { path = "../irontraffic-runtime", version = "0.1.0" }
# The accept loop's `time` parameter is `Arc<dyn irontraffic_time::TimeSource>`,
# passed straight through to `irontraffic_runtime::core::turn_tick`.
irontraffic-time = { path = "../irontraffic-time", version = "0.1.0" }
# CachePadded for ConnRegistry's shared atomic.
crossbeam-utils = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
smallvec = { workspace = true }
# ParseStatus and RejectReason have exactly one definition, used by the PROXY
# protocol parser this crate gains in a later issue.
irontraffic-http = { path = "../irontraffic-http", version = "0.1.0" }

[dev-dependencies]
# The reactor-dependent tests (into_acceptors and the accept tests) need a
# real tokio runtime; this crate's own src/ never names tokio, enforced by
# the transport-seam invariant lint.
tokio = { workspace = true }
# Test 13, prop_registry_conservation.
proptest = { workspace = true }
# The registry benchmarks.
criterion = { workspace = true }

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "conn_hot"
harness = false
