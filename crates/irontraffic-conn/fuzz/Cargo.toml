# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Not a workspace member: the empty [workspace] table below is required so
# that Cargo treats this manifest as its own independent workspace root
# instead of trying to join the ancestor workspace at the repository root.
# This is the standard cargo-fuzz layout and mirrors
# crates/irontraffic-http/fuzz/Cargo.toml.
[package]
name = "irontraffic-conn-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-conn = { path = ".." }

[[bin]]
name = "fuzz_budget_events"
path = "fuzz_targets/fuzz_budget_events.rs"
test = false
doc = false
bench = false
