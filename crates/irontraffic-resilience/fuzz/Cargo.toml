[package]
name = "irontraffic-resilience-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# An EMPTY workspace table. This is load bearing: without it, cargo sees a manifest inside
# a workspace member directory that is not listed in the root `[workspace] members` and
# fails every build in the repository with "current package believes it's in a workspace
# when it's not". The empty table makes the fuzz crate its own one-member workspace, which
# is what `cargo fuzz init` generates and what the rest of this repository already does
# (see `config-load-and-validate` (#15) and `forward-bidirectional` (#20)). Because it is
# its own workspace it cannot use `edition.workspace = true`, hence the literal edition.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
irontraffic-resilience = { path = ".." }
# fuzz_pushback_headers seeds its own Rng the same way resolve_backoff's real
# callers do, so it needs the crate declared here too, same as the sibling
# path deps above.
irontraffic-rand = { path = "../../irontraffic-rand" }

[[bin]]
name = "fuzz_deadline_headers"
path = "fuzz_targets/fuzz_deadline_headers.rs"
test = false
doc = false

[[bin]]
name = "fuzz_outlier_stats"
path = "fuzz_targets/fuzz_outlier_stats.rs"
test = false
doc = false

[[bin]]
name = "fuzz_retryability"
path = "fuzz_targets/fuzz_retryability.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pushback_headers"
path = "fuzz_targets/fuzz_pushback_headers.rs"
test = false
doc = false
