[package]
name = "irontraffic-resilience"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resilience primitives for IronTraffic: health checking, retries, deadlines, and load shedding."

[lints]
workspace = true

[dependencies]
irontraffic-rand = { path = "../irontraffic-rand", version = "0.1.0" }
crossbeam-utils.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "timer_wheel"
harness = false

[[bench]]
name = "limits"
harness = false

[[bench]]
name = "outlier_stats"
harness = false

[[bench]]
name = "health_bitmap"
harness = false

[[bench]]
name = "retry_backoff"
harness = false
