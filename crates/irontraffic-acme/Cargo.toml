# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "irontraffic-acme"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables the pebble-backed integration tests. Never enabled in a release build.
acme-integration = []
schema = ["dep:schemars"]

[dependencies]
instant-acme = "0.8.5"
serde = { workspace = true }
schemars = { workspace = true, optional = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
# base64url decoding of the EAB HMAC key; instant-acme's ExternalAccountKey takes raw bytes
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["time", "fs"] }
irontraffic-tls = { path = "../irontraffic-tls", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }