# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "irontraffic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTraffic: a traffic and API manager. L4 and L7 load balancing, API gateway, and ingress."

[lints]
workspace = true

[features]
default = ["control-plane"]
# The control plane: the control-plane runtime today, and the admin API, the
# configuration providers, the Kubernetes controller, the consensus crate, and the
# dashboard assets in later milestones. Every one of those arrives as a dependency
# under this feature and never under `default` directly.
control-plane = []
# The data-plane-only build. Empty on purpose: it is the name the documented
# invocation `--no-default-features --features dataplane` requires, and later
# milestones hang data-plane-only wiring off it. It does not turn anything off;
# turning things off is what `--no-default-features` does.
dataplane = []

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# load, validate, and the types the `validate` mode's flags parse into.
irontraffic-config = { path = "../irontraffic-config", version = "0.1.0" }
# the accept loop, the connection registry and guard, the sharded listener,
# and the graceful drain.
irontraffic-conn = { path = "../irontraffic-conn", version = "0.1.0" }
# the one-buffer-of-credit bidirectional forwarding loop.
irontraffic-dataplane = { path = "../irontraffic-dataplane", version = "0.1.0" }
# the transport seam: capability probe, spawner, shutdown signalling, the timer.
irontraffic-io = { path = "../irontraffic-io", version = "0.1.0" }
# the entropy seam: the per-core RNG seed.
irontraffic-rand = { path = "../irontraffic-rand", version = "0.1.0" }
# the two tokio runtimes and the per-core counter state.
irontraffic-runtime = { path = "../irontraffic-runtime", version = "0.1.0" }
# the process clock, constructed once at startup.
irontraffic-time = { path = "../irontraffic-time", version = "0.1.0" }
# the single upstream connector.
irontraffic-upstream = { path = "../irontraffic-upstream", version = "0.1.0" }

[dev-dependencies]
# the in-test origin server and the child-process smoke test driver need an
# async runtime; the binary itself never names tokio (see
# `crates/irontraffic/src/serve.rs`).
tokio = { workspace = true }
