[package]
name = "irontraffic-ws-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# An EMPTY workspace table. This is load bearing: without it, cargo sees a manifest inside
# a workspace member directory that is not listed in the root `[workspace] members` and
# fails every build in the repository with "current package believes it's in a workspace
# when it's not". The empty table makes the fuzz crate its own one-member workspace, which
# is what `cargo fuzz init` generates and what the rest of this repository already does
# (see crates/irontraffic-resilience/fuzz/Cargo.toml and issue #509's fix to the fuzz CI
# lane, which discovers fuzz projects at crates/<name>/fuzz/Cargo.toml and never at a root
# fuzz/ that this repository does not have and will not add). Because it is its own
# workspace it cannot use `edition.workspace = true`, hence the literal edition.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-ws = { path = ".." }
# fuzz_ws_handshake drives the real H1Parser + canonicalize_request pipeline (the
# same one the handshake tests use) and builds FieldSection values directly with
# FieldSectionBuilder, both of which live in irontraffic-http rather than
# irontraffic-ws. Added by ws-upgrade-handshake (#203).
irontraffic-http = { path = "../../irontraffic-http" }
# fuzz_ws_handshake builds the caller-supplied BytesMut arena FieldSectionBuilder and
# canonicalize_request write into; version matches the workspace's bytes = "1.10" pin.
bytes = "1.10"

[[bin]]
name = "fuzz_ws_frame"
path = "fuzz_targets/fuzz_ws_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ws_handshake"
path = "fuzz_targets/fuzz_ws_handshake.rs"
test = false
doc = false
bench = false
