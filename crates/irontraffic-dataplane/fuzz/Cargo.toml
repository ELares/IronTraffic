#
# Not a workspace member: the empty [workspace] table below is required so that
# Cargo treats this manifest as its own independent workspace root instead of
# trying to join the ancestor workspace at the repository root. This is the
# standard cargo-fuzz layout: a cargo-fuzz project pins its own
# toolchain-sensitive edition and is built with `cargo fuzz`, never
# `cargo build --workspace`. Deviation from issue #20's literal `## Files`
# table, which named a shared root-level `fuzz/Cargo.toml`: the repository's
# actual, CI-enforced convention (see the `fuzz` job in .github/workflows/ci.yml
# and issue #509, which fixed exactly this) is one fuzz project per crate at
# `crates/<name>/fuzz/`, matching `crates/irontraffic-http/fuzz/` and
# `crates/irontraffic-router/fuzz/`. A root `fuzz/` is never discovered by that
# job's `find crates -mindepth 3 -maxdepth 3 -path '*/fuzz/Cargo.toml'`, so the
# target would silently never run in CI. Filed as a defect against issue #20's
# specification; see the coder's report.
[package]
name = "irontraffic-dataplane-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-dataplane = { path = "..", features = ["test-support"] }
irontraffic-io = { path = "../../irontraffic-io" }
# Only `enable_time` is used: `forward_bidirectional`'s two deadlines arrive
# through `hyper::rt::Timer`, backed here by the same current-thread runtime
# the target drives itself with. Version matches the workspace's tokio pin.
tokio = { version = "1.53.1", features = ["rt", "time"] }

[[bin]]
name = "fuzz_forward_framing"
path = "fuzz_targets/fuzz_forward_framing.rs"
test = false
doc = false
bench = false
