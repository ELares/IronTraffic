# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Not a workspace member: the empty [workspace] table below is required so that
# Cargo treats this manifest as its own independent workspace root instead of
# trying to join the ancestor workspace at the repository root (the root
# Cargo.toml's [workspace] `exclude` entries only cover a few of the fuzz
# crates in this tree already; the empty table here is what actually stops
# Cargo from treating this nested-but-unlisted manifest as wanting to join the
# ancestor workspace, matching crates/irontraffic-ws/fuzz/Cargo.toml and
# crates/irontraffic-resilience/fuzz/Cargo.toml, neither of which is listed in
# the root exclude array either). This is the standard cargo-fuzz layout: a
# cargo-fuzz project pins its own toolchain-sensitive edition and is built
# with `cargo fuzz`, never `cargo build --workspace`.
[package]
name = "irontraffic-policy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-policy = { path = ".." }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false
