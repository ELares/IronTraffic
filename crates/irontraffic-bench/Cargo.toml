[package]
name = "irontraffic-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-IO benchmark harness vocabulary for IronTraffic: cell ids, the published matrix and the parsers the driver binary calls into."
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# `rustix::process::getrlimit(Resource::Nofile)` for `Provenance::ulimit_nofile`.
# No C build, no `unsafe` in our code.
rustix = { workspace = true, features = ["process"] }
# `LatencyRecorder` in `src/hist.rs`: a library type that `probe`, `loadgen`,
# `result` and `aggregate` all name, so this is a normal dependency, never a
# dev-dependency. `default-features = false` drops `serialization`, `sync`
# and, with them, `flate2`, `base64` and `crossbeam-channel`: every call this
# module makes (`record`, `record_n`, `add`, `value_at_quantile`, `max`,
# `len`, `iter_quantiles`) is in the crate core, and the committed artifact is
# the text `.hgrm`, never the binary serialisation.
hdrhistogram = { workspace = true }
# Pins the probe thread (`src/probe.rs`) to a core the load client does not
# use. Workspace-internal crates are named by relative path and never through
# `[workspace.dependencies]`.
core_affinity = { workspace = true }
# `probe::ProbeHandle::spawn`'s `time` parameter and the workspace clock seam
# (`PreciseMono`, `SharedTime`) the probe thread reads instead of calling
# `std::time::Instant::now` directly. Already on main from `time-source-seam`
# (#5).
irontraffic-time = { path = "../irontraffic-time", version = "0.1.0" }
# The `oha` load-generator adapter's output parser (`src/loadgen/oha.rs`)
# deserialises the tool's captured JSON stdout. Moved here from
# dev-dependencies by `bench-loadgen-oha-adapter` (#411): `bench-crate-and-cell-model`
# (#404) put it under dev-dependencies because nothing under `src/` needed it
# yet, and this parser is the first. `store.rs` in `bench-xtask-cli-and-run-sh`
# (#417) and `reload.rs` in `bench-config-reload-under-load` (#420) both
# depend on it staying a normal dependency; a crate does not need both.
serde_json = { workspace = true }
# `corpus::path_samples` draws from `irontraffic_rand::Rng`, seeded, never
# from `rand` (`bench-matrix-cells-and-corpora`, #414): `rand::` is banned
# outside `crates/irontraffic-rand` by the `determinism-seam` invariant lint.
irontraffic-rand = { path = "../irontraffic-rand", version = "0.1.0" }

[dev-dependencies]
proptest = { workspace = true }
# Benchmarks: the `record_ns`, `merge` and `percentiles` criterion targets in
# `benches/harness.rs`.
criterion = { workspace = true }
# `tests/probe.rs` spawns a real `it-origin` child process
# (`env!("CARGO_BIN_EXE_it-origin")`), per the Tests section: every test but
# 5, 6, 8, 13, 14, 15 and 16 (which use an in-test stub instead) drives it.
# `CARGO_BIN_EXE_<name>` is only populated for a binary target that is a
# dependency of the crate under test, so this dev-dependency is what makes
# that environment variable exist at all; not part of the issue's Files table
# line for this manifest, added because the Tests section's own requirement
# (a real `it-origin` on an ephemeral port) cannot compile otherwise. Test-only:
# never a normal dependency, and `irontraffic-bench`'s own production code
# never names it.
irontraffic-origin = { path = "../irontraffic-origin", version = "0.1.0" }
# Test 7a (`bench-matrix-cells-and-corpora`, #414) expands the two committed
# corpus regex files with the SAME crate and the SAME `max_repeat` bound the
# pinned `oha` release uses; see the workspace `Cargo.toml`'s own comment on
# `rand_regex` for why. `rand_regex` needs a caller-supplied `rand::Rng` and
# does not re-export `rand` itself, so this direct `rand` entry is the
# minimal glue that lets test 7a name a concrete RNG type
# (`rand::rngs::StdRng`) at all; it is not named in this issue's own Cargo.toml
# Files table row, which enumerates only `rand_regex` and `sha2`, because the
# need for it follows from `rand_regex`'s own public API rather than being a
# separate design choice. `it-allow: determinism-seam reason: test 7a must
# expand with the same crate and the same bound the pinned oha release uses,
# which is the whole point of the test` marks every use of it in
# `tests/matrix.rs`; it must never appear under `src/`.
rand = "0.10"
# The workspace `Cargo.toml` pins the version; see its own comment for the
# full rationale and the exact provenance of the `0.19.0` pin.
rand_regex = { workspace = true }
# Hashes the resolved command line for each entry in `bench/cells.snapshot`
# (test 7, invariant I12): `sha2 = "0.11"` is already pinned in the workspace
# `Cargo.toml` by `cluster-derived-session-ticketer` (#120), so this takes it
# via `workspace = true` rather than restating the version.
sha2 = { workspace = true }

[[bench]]
name = "harness"
harness = false
