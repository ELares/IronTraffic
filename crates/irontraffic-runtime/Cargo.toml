# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "irontraffic-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime construction for IronTraffic."

[lints]
workspace = true

[dependencies]
# Used by `runtime-dataplane-build` (#12) for the runtime startup log, and by
# `runtime-core-scope` (#13) to log the observed migration outcome in the
# forced-migration test rather than printing to stdout/stderr.
tracing = { workspace = true }
# Used by `runtime-dataplane-build` (#12) for typed error enums.
thiserror = { workspace = true }
# Used by `runtime-dataplane-build` (#12) to build the data-plane and
# control-plane runtimes.
tokio = { workspace = true }
# Used by `runtime-dataplane-build` (#12): `DataPlane::spawner` and
# `ControlPlane::spawner` return `irontraffic_io::Spawner`, the only way out
# of this crate into task spawning. `runtime-core-scope` (#13) also calls
# `irontraffic_io::buffer::BufPool::with_current` from `turn_tick`.
irontraffic-io = { path = "../irontraffic-io", version = "0.1.0" }
# CachePadded for the per-core state array (`runtime-core-scope`, #13).
crossbeam-utils = { workspace = true }
# The cached coarse clock (`AtomicCoarseCache`) `turn_tick` refreshes and
# `CoreCtx::now_mono`/`now_wall` read (`runtime-core-scope`, #13).
irontraffic-time = { path = "../irontraffic-time", version = "0.1.0" }
# `wyrand_step` and `split_mix64`, the pure functions that let the per-core
# RNG state live in an atomic (`runtime-core-scope`, #13).
irontraffic-rand = { path = "../irontraffic-rand", version = "0.1.0" }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "core_scope"
harness = false
