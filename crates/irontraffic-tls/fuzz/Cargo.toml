# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Not a workspace member: the empty [workspace] table below is required so
# that Cargo treats this manifest as its own independent workspace root
# instead of trying to join the ancestor workspace at the repository root
# (the root Cargo.toml's [workspace] exclude entry only stops implicit glob
# discovery from picking this directory up; it does not, by itself, stop
# Cargo from treating a nested-but-unlisted manifest as wanting to join that
# ancestor workspace, which fails with "current package believes it's in a
# workspace when it's not"). This is the standard cargo-fuzz layout and
# mirrors crates/irontraffic-router/fuzz/Cargo.toml, the only other fuzz
# crate in this tree.
[package]
name = "irontraffic-tls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-tls = { path = ".." }
# fuzz_crl_parse's own dependency, not shared by the other two targets: it builds a real,
# validly signed CRL per input (see that target's module doc for why a signature must actually
# verify) using rcgen's CertificateRevocationListParams builder. rcgen's `ring`-only default
# features cannot generate RSA keys at all (RSA key generation is gated behind the `aws_lc_rs`
# feature; see rcgen's own KeyPair::generate_for), so this mirrors the same feature addition
# crates/irontraffic-tls/Cargo.toml's own dev-dependency on rcgen already makes, on top of the
# workspace default rather than instead of it.
rcgen = { version = "0.14.8", features = ["aws_lc_rs"] }

[[bin]]
name = "fuzz_sni_normalize"
path = "fuzz_targets/fuzz_sni_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cert_load"
path = "fuzz_targets/fuzz_cert_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_crl_parse"
path = "fuzz_targets/fuzz_crl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_client_hello"
path = "fuzz_targets/fuzz_client_hello.rs"
test = false
doc = false
bench = false
