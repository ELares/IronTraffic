[package]
name = "irontraffic-tls"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The three crypto provider features are MUTUALLY EXCLUSIVE and enforced with
# compile_error!, because rustls cannot install two providers as the process
# default at once. Declaring them here is what tells scripts/feature-matrix.sh to
# expand this crate into one run PER provider instead of a single --all-features
# run that cannot compile by construction. Without this declaration the gate is
# unsatisfiable for this crate; see issue #456.
[package.metadata.gate]
exclusive-features = ["crypto-aws-lc-rs", "crypto-ring", "crypto-fips"]

[features]
default = ["crypto-aws-lc-rs"]
crypto-aws-lc-rs = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]
crypto-ring = ["rustls/ring"]
crypto-fips = ["rustls/fips", "rustls/aws_lc_rs", "rustls/prefer-post-quantum"]
schema = ["dep:schemars"]

[dependencies]
rustls = { workspace = true }
siphasher = { workspace = true }
blake3 = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
irontraffic-rand = { path = "../irontraffic-rand", version = "0.1.0" }
serde = { workspace = true }
schemars = { workspace = true, optional = true }
# TlsMaterialCell's wait-free publication of a rebuilt certificate index; see
# the workspace Cargo.toml comment on this dependency and issue #118.
arc-swap = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
# rcgen's `ring`-only default features cannot generate RSA keys at all (RSA key generation is
# gated behind the `aws_lc_rs` feature; see rcgen's own KeyPair::generate_for). Test 3
# (load_rsa2048) needs a real, freshly generated RSA key pair and the issue that specifies this
# module forbids committing a private key fixture instead, so this feature is added on top of
# the workspace-level dependency rather than relying on its default features. aws-lc-rs is
# already a resolved dependency of this crate's own default `crypto-aws-lc-rs` feature, so this
# does not add a new crate to the tree.
rcgen = { workspace = true, features = ["aws_lc_rs"] }

[[bench]]
name = "name"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "crl"
harness = false

[[bench]]
name = "index_build"
harness = false
