[package]
name = "irontraffic-upstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dials the one configured upstream socket address with a bounded connect deadline."

[lints]
workspace = true

[dependencies]
# UpstreamAddr, the validated configuration literal this crate dials.
irontraffic-config = { path = "../irontraffic-config", version = "0.1.0" }
# TcpTransport, with_timeout, and connect_tcp: the transport seam's one dial primitive.
irontraffic-io = { path = "../irontraffic-io", version = "0.1.0" }
# ConnectError is a typed error enum without a hand-written Display impl.
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
