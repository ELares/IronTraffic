[package]
name = "irontraffic-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTraffic's sans-IO HTTP parse boundary: the single place attacker-chosen bytes become a decision."

[lints]
workspace = true

[dependencies]
# `BytesMut`, the join buffer `hlist::CookieAccumulator::join_into` writes
# into. Never `Vec<u8>` in the data plane.
bytes = { workspace = true }
# Inline, non-heap-allocated crumb index (`SmallVec<[(u32, u32); 8]>`) in
# `hlist::CookieAccumulator`, so the common one- or two-crumb cookie never
# allocates. `memchr` stays out of this manifest: still referenced by
# nothing in src/ (see the removed D6 note this replaces).
smallvec = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "http_hot"
harness = false
