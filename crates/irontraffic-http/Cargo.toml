[package]
name = "irontraffic-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTraffic's sans-IO HTTP parse boundary: the single place attacker-chosen bytes become a decision."

[lints]
workspace = true

[dependencies]
# D6: bytes, smallvec and memchr were declared here but referenced by
# nothing in src/ (smallvec pulled in with the `union` feature, its unsafe
# union-storage variant, into a crate that is `#![forbid(unsafe_code)]`).
# deny.toml's own preamble says the tree is reviewed rather than
# accumulated; removed. The issue that first actually uses one of these
# declares it again then.
#
# field-section-and-known-headers (#24) is that issue for bytes and
# smallvec: `FieldSection`'s arena is a caller-supplied `BytesMut`/`Bytes`
# and its slot index is a `SmallVec<[FieldSlot; 32]>`. memchr remains
# unused by this crate and stays out.
# `authority-parsing-and-reconciliation` (#30) is that first user: `Authority`
# stores its canonical host in a `Bytes`, and `Authority::parse_into` writes
# into a caller-supplied `BytesMut` and takes a `Bytes` view of it with
# `split_off`/`freeze`, the same pattern `irontraffic-io`'s buffer pool
# already uses. Declared here again per D6's own note above.
bytes = { workspace = true }
# `BytesMut`, the join buffer `hlist::CookieAccumulator::join_into` writes
# into. Never `Vec<u8>` in the data plane.
# Inline, non-heap-allocated crumb index (`SmallVec<[(u32, u32); 8]>`) in
# `hlist::CookieAccumulator`, and the inline-32 `SmallVec<[RawField; 32]>`
# field list in `h1::parser::RawHead`/`RawResponseHead`, so the common one-
# or two-crumb cookie and the common sub-32-field head never allocate.
smallvec = { workspace = true }
# SIMD-accelerated search for the head terminator (`\r\n\r\n`) and per-line
# CRLF boundaries in `h1::parser`. Pure Rust, musl safe. First used by
# `h1-head-parser` (#34); see D6's note above for why it was removed from
# this manifest until a real caller existed.
memchr = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "http_hot"
harness = false

[[bench]]
name = "http_priority"
harness = false

[[bench]]
name = "http_trust"
harness = false
