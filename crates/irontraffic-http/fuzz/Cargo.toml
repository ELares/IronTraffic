[package]
name = "irontraffic-http-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# An EMPTY workspace table. Without it, cargo sees a package nested under a workspace
# directory that does not list it as a member and refuses to build with
# "current package believes it's in a workspace when it's not".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-http = { path = ".." }
# fuzz_authority builds the caller-supplied BytesMut Authority::parse_into
# writes into; version matches the workspace's bytes = "1.10" pin.
bytes = "1.10"
# fuzz_h1_differential's oracle: a good, fast HTTP/1 tokenizer that tolerates
# input H1Parser must refuse (bare LF, obs-fold), used ONLY here to prove we
# are never laxer than it, never in the library (see h1::parser's module doc
# for why it is not the framing decision maker). Dev/fuzz-only dependency.
httparse = "1"

[[bin]]
name = "fuzz_field_validate"
path = "fuzz_targets/fuzz_field_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_authority"
path = "fuzz_targets/fuzz_authority.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_forwarded"
path = "fuzz_targets/fuzz_forwarded.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_h1_head"
path = "fuzz_targets/fuzz_h1_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_h1_differential"
path = "fuzz_targets/fuzz_h1_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_chunked"
path = "fuzz_targets/fuzz_chunked.rs"
test = false
doc = false
bench = false

# fuzz_path.rs existed in fuzz_targets/ since #29/#512 with NO entry here, which
# meant it had never been fuzzed once. `cargo fuzz list` enumerates `[[bin]]`
# stanzas, not files on disk, so the target was invisible to the runner while
# looking present to any reader of the directory. The surface it covers is
# `NormalizedPath::parse_into`, which is the CVE-2025-66490 encoded-dot path, so
# this was the highest risk parser in the crate going unfuzzed. See #699, and the
# fifth fail-closed check added to the fuzz lane in the same PR that makes an
# unregistered target file a red build rather than a silent omission.
[[bin]]
name = "fuzz_path"
path = "fuzz_targets/fuzz_path.rs"
test = false
