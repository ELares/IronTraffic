[package]
name = "irontraffic-http-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# An EMPTY workspace table. Without it, cargo sees a package nested under a workspace
# directory that does not list it as a member and refuses to build with
# "current package believes it's in a workspace when it's not".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
irontraffic-http = { path = ".." }
# fuzz_authority builds the caller-supplied BytesMut Authority::parse_into
# writes into; version matches the workspace's bytes = "1.10" pin.
bytes = "1.10"
# fuzz_h1_differential's oracle: a good, fast HTTP/1 tokenizer that tolerates
# input H1Parser must refuse (bare LF, obs-fold), used ONLY here to prove we
# are never laxer than it, never in the library (see h1::parser's module doc
# for why it is not the framing decision maker). Dev/fuzz-only dependency.
httparse = "1"

[[bin]]
name = "fuzz_field_validate"
path = "fuzz_targets/fuzz_field_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_authority"
path = "fuzz_targets/fuzz_authority.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_forwarded"
path = "fuzz_targets/fuzz_forwarded.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_h1_head"
path = "fuzz_targets/fuzz_h1_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_h1_differential"
path = "fuzz_targets/fuzz_h1_differential.rs"
test = false
doc = false
bench = false
