#
# Not a workspace member: the empty [workspace] table below is required so that
# Cargo treats this manifest as its own independent workspace root instead of
# trying to join the ancestor workspace at the repository root (the root
# Cargo.toml's [workspace] `exclude` entry for `crates/irontraffic-router/fuzz`
# only stops implicit glob discovery from picking a nested directory up; it does
# not, by itself, stop Cargo from treating a nested-but-unlisted manifest as
# wanting to join that ancestor workspace). This is the standard cargo-fuzz
# layout: a cargo-fuzz project pins its own toolchain-sensitive edition and is
# built with `cargo fuzz`, never `cargo build --workspace`. `forward-bidirectional`
# (#20) adds a second target to this same manifest and neither issue blocks the
# other: whichever lands first creates this file with both `libfuzzer-sys` and
# `arbitrary` already declared, and the other issue only adds one `[[bin]]`
# section plus one path dependency on the crate it fuzzes, changing nothing else.
[package]
name = "irontraffic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
irontraffic-config = { path = "../crates/irontraffic-config" }
# The target calls `serde_json::from_str::<BootstrapDoc>` and
# `serde_norway::from_str::<BootstrapDoc>` directly, per the issue's own fuzz
# target contract. Rust's 2018-and-later edition dependency resolution does not
# expose a dependency's own dependencies by name, so calling either function
# needs the crate declared here too, at the same version irontraffic-config
# itself pins; this is not a new third-party crate entering the tree, only a
# second manifest re-declaring one already reviewed for the main workspace.
serde_json = "1.0.151"
serde_norway = "0.9.42"

[[bin]]
name = "fuzz_parse_bootstrap"
path = "fuzz_targets/fuzz_parse_bootstrap.rs"
test = false
doc = false
bench = false
