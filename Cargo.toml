# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The IronTraffic Cargo virtual workspace.
#
# The crate graph IS the architecture. Each crate is a seam that the compiler
# enforces, which matters more here than in most projects because the
# implementers are small language models: a boundary written only in prose gets
# crossed, and a boundary expressed as a crate cannot be.
#
# The full planned graph is documented in ARCHITECTURE.md. Crates appear in this
# file as the issues that create them land, so that `cargo build` is green at
# every commit and no member ever points at a directory that does not exist.

[workspace]
resolver = "3"
members = ["crates/irontraffic", "crates/irontraffic-bench", "crates/irontraffic-config", "crates/irontraffic-conn", "crates/irontraffic-dataplane", "crates/irontraffic-filter", "crates/irontraffic-http", "crates/irontraffic-io", "crates/irontraffic-k8s", "crates/irontraffic-limits", "crates/irontraffic-obs", "crates/irontraffic-policy", "crates/irontraffic-quota", "crates/irontraffic-rand", "crates/irontraffic-resilience", "crates/irontraffic-router", "crates/irontraffic-runtime", "crates/irontraffic-time", "crates/irontraffic-tls", "crates/irontraffic-upgrade", "crates/irontraffic-upstream", "crates/irontraffic-ws"]
# The fuzz crate is intentionally not a workspace member: cargo-fuzz projects
# The fuzz crates are intentionally not workspace members: cargo-fuzz projects
# The fuzz crate is intentionally not a workspace member: cargo-fuzz projects
# pin their own toolchain-sensitive edition and are built with `cargo fuzz`,
# never `cargo build --workspace`.
exclude = [
    "crates/irontraffic-config/fuzz",
    "crates/irontraffic-router/fuzz",
    "crates/irontraffic-tls/fuzz",
    "crates/irontraffic-upgrade/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ELares/IronTraffic"

[workspace.dependencies]
# The runtime. Named only inside `irontraffic-io` and `irontraffic-runtime`.
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
# `hyper::rt::Read` / `hyper::rt::Write` / `ReadBuf` / `Timer`: the transport seam.
hyper = { version = "1.11.0", default-features = false }
# `TokioIo` and `TokioTimer`, the only place tokio and hyper meet.
hyper-util = { version = "0.1", features = ["tokio"] }
# `BytesMut` pooled read chunks. Never `Vec<u8>` in the data plane.
bytes = { version = "1.10" }
# Inline, non-heap-allocated small buffers (a method token, a chunk extension)
# in `irontraffic-http`. `union` and `const_generics` are the layout and sizing
# features the parse-boundary crate needs; no C build involved.
smallvec = { version = "1", features = ["union", "const_generics"] }
# SIMD-accelerated byte search for scanning header and line terminators
# (CRLF, colon, space) in `irontraffic-http`. Pure Rust, musl safe.
memchr = { version = "2" }
# `set_reuse_port` before `bind`, backlog, `TCP_NODELAY`, `ipv6_only`.
socket2 = { version = "0.6", features = ["all"] }
# `clock_gettime(CLOCK_BOOTTIME)` without a C build and without `unsafe` in our code.
rustix = { version = "1.0", features = ["time"] }
# The CSPRNG side of the randomness seam.
getrandom = { version = "0.4" }
# Config layer 1.
serde = { version = "1.0.151", features = ["derive"] }
# JSON config input, canonical serialisation.
serde_json = { version = "1.0.151" }
# YAML config input. `serde_yaml` is `0.9.34+deprecated`.
serde_norway = { version = "0.9.42" }
# Short interned names in config types, inline up to 23 bytes in 0.3.
smol_str = { version = "0.3" }
# `CachePadded` for the per-core state array.
crossbeam-utils = { version = "0.8" }
# Typed error enums without hand-written `Display`.
thiserror = { version = "2.0" }
# Lifecycle logging. Banned from the request path.
tracing = { version = "0.1.41" }
# The one subscriber, installed in the binary.
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
# Property tests.
proptest = { version = "1.5" }
# Benchmarks.
criterion = { version = "0.8" }
# HDR histogram for percentile recording. Neither of its two consumers,
# gradient-adaptive-concurrency (#106) and this milestone's own
# bench-histogram-and-percentiles, has landed yet, so bench-crate-and-cell-model
# (#404) pins it here first: the key was genuinely absent, and a second
# hdrhistogram key with a different version string would stop the workspace
# resolving for every crate. Version and default-features = false match #106's
# own stated pin exactly, so whichever of the two lands next takes it via
# workspace = true instead of redeclaring it.
hdrhistogram = { version = "7", default-features = false }
# Calendar arithmetic with a bundled IANA tzdb. Used by `irontraffic-quota`.
jiff = { version = "0.2.34" }
# Kubernetes client. Only in the control-plane crate.
kube = { version = "4.2.0", default-features = false, features = ["client"] }
# Kubernetes API types. `latest` matches the bundled OpenAPI spec.
k8s-openapi = { version = "0.28.0", features = ["latest"] }
# NOTE: --all-features cannot build irontraffic-tls; its crypto-* features are
# mutually exclusive by design. See docs/tls/BUILD-MATRIX.md.
rustls = { version = "0.23.42", default-features = false, features = ["std", "tls12", "logging"] }
# keyed SipHash-1-3 for attacker-controlled DNS names; unkeyed hashes allow
# offline collision construction against the certificate index
siphasher = "1.0.3"
# Deterministic concurrency model checker for the leased-semaphore CAS
# protocol in irontraffic-resilience, behind `--cfg loom` only.
loom = { version = "0.7" }
# JSON Schema generation for the config layer 1 newtypes, derived straight from
# the Rust types so the schema and the validator can never disagree. No
# integration feature needed: every newtype spells `#[schemars(with = "...")]`
# rather than deriving a schema from its private field.
# Also emits the JSON Schema the config plane publishes; optional in each member
# crate, behind that crate's `schema` feature. This branch originally added a
# SECOND `schemars` key here at 0.8 while main already carried 1.2.1, which is
# invalid TOML rather than a merge conflict, so git produced it without a marker
# and only `cargo metadata` complained (issue #596). One key, 1.2.1: every use on
# this branch is `derive(schemars::JsonSchema)`, which exists in both majors, and
# member crates take it via `workspace = true` so they follow whatever is pinned
# here.
schemars = { version = "1.2.1" }
# content-addressing DER blobs and computing stable certificate fingerprints
blake3 = "1"
# X.509 field extraction (validity, SPKI OID, SANs, tlsfeature, serial, issuer DN);
# pinned on the 0.2 line because x509-ocsp 0.2.1, added by #122, depends on that same line
x509-cert = "0.2"
# Streaming DER walk for CRL parsing: `x509-cert` re-exports `der` transitively, but the CRL
# walker needs its `SliceReader` and `Reader` traits directly to skip unknown bytes without
# materializing per-entry structs.
der = "0.7"
# RFC 6960 OCSP request/response types (`ocsp-staple-validation-and-updater`, #122):
# `OCSPRequest`, `OCSPResponse`, `BasicOCSPResponse`, `CertID`, `ResponderID`. Self-described as
# early-stage upstream, which is why the response validator is fuzzed rather than trusted. This
# crate never enables its `builder` feature (that pulls in `digest`, `rand_core` and `signature`,
# none of which this issue's dependency list authorizes); requests are built by hand from this
# crate's own typed fields instead.
x509-ocsp = "0.2.1"
# dev-only: builds certificate fixtures in tests so no key material is committed
rcgen = "0.14.8"
# RFC 6455 Section 4.2.2 Sec-WebSocket-Accept computation: SHA-1 over the
# base64 Sec-WebSocket-Key string plus the RFC GUID. Not pinned by an earlier
# milestone in this tree yet, so `ws-upgrade-handshake` (#203) pins it here. Also the mandatory
# `CertID` identifier hash RFC 6960 section 4.1.1 specifies for OCSP
# (`ocsp-staple-validation-and-updater`, #122); never used as a signature algorithm.
sha1 = "0.10"
# `ConstantTimeEq` for comparing the recomputed Sec-WebSocket-Accept against
# the value the upstream sent, per the workspace's `constant-time-secrets`
# invariant lint. Not pinned by an earlier milestone in this tree yet, so
# `ws-upgrade-handshake` (#203) pins it here.
subtle = "2.6"
# Constant-time, allocation-free base64 for the Sec-WebSocket-Key and
# Sec-WebSocket-Accept wire values (`ws-upgrade-handshake`, #203).
base64ct = "1.6"
# Wait-free publication cell for the TLS certificate index
# (`cert-index-incremental-rebuild-and-publish`, #118): a reload builds a
# whole new `CertIndex` off the hot path and stores it with one atomic
# pointer swap, so a handshake in `TlsMaterialCell::load` never blocks on a
# reload and an in-flight connection is never torn. Declared here, at exactly
# the third allowlisted site in the whole workspace; see decision-ledger
# entry 42's amendment and `scripts/allowlist-arcswap-store.txt`.
arc-swap = "1.9.2"
# HMAC-SHA384, the primitive `irontraffic-tls`'s hand-rolled RFC 5869
# HKDF-Extract/Expand (`hkdf.rs`) runs over for the cluster-derived TLS session
# ticket key schedule (`cluster-derived-session-ticketer`, #120). Only
# `irontraffic-tls` names it.
hmac = "0.12"
# SHA-384, the hash the HKDF above is built on (`cluster-derived-session-ticketer`,
# #120).
sha2 = "0.10"
# XChaCha20-Poly1305 for TLS session ticket encryption (`cluster-derived-session-ticketer`,
# #120), a deliberate deviation from the design note's AES-256-GCM: a 192-bit
# random nonce needs no per-key nonce-collision analysis the way a 96-bit
# AES-GCM nonce would, and this AEAD is sourced from this crate rather than from
# a `rustls::crypto` provider, so the ticket format is byte-identical on
# `crypto-aws-lc-rs` and `crypto-ring` builds.
chacha20poly1305 = "0.10"
# Zeroizes the cluster ticket root, its HKDF pseudorandom key, and every derived
# epoch key on drop (`cluster-derived-session-ticketer`, #120). The root is the
# highest-value secret in the product; it must never linger in freed memory.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# dev-only: cross-checks `irontraffic-tls`'s hand-rolled HKDF-SHA384 against
# `aws_lc_rs::hkdf` in `hkdf_matches_aws_lc_rs` (`cluster-derived-session-ticketer`,
# #120). `aws-lc-rs` is already a transitive dependency of `rustls`'s
# `crypto-aws-lc-rs` feature; this adds a direct dev-dependency entry so the
# differential test can name it in a `use`.
aws-lc-rs = "1"

[workspace.lints.rust]
# A proxy parses attacker-controlled bytes on every request. There is no
# unsafe block an implementer is authorized to write; performance work that
# appears to need one is a design conversation on the issue, not a local edit.
unsafe_code = "deny"
# Every public item is documented, because the implementers of the NEXT issue
# read these docs as their specification.
missing_docs = "warn"
unreachable_pub = "warn"
# A narrowing conversion on a value derived from the network is a truncation
# bug waiting to happen; make the lossy ones visible.
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# A Result or future that is silently dropped is a bug; explicit discards are required.
unused_must_use = "deny"

[workspace.lints.clippy]
# Pedantic is the floor. CI runs with `-D warnings`, so every entry below that
# says "warn" is an ERROR in CI; the level only changes the local experience.
# Exceptions are granted per item with `reason = "..."`, never blanket-allowed,
# and the allow-needs-reason invariant lint enforces that.
pedantic = { level = "warn", priority = -1 }

# The async correctness lints that matter most in a proxy. Holding a lock or a
# RefCell borrow across an await point is the single most common way to turn a
# working handler into a deadlock or a data race under load. The subtle form is
# a guard held by a temporary in a `while let` scrutinee, which lives to the end
# of the loop body; bind the guard in an inner scope so it drops before the await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# A narrowing or sign-changing cast applied to a length or an index that came
# off the wire is a truncation bug. `try_from` with a real error, or a proven
# bound, every time.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

# Panics are outages. clippy.toml turns these off inside test code, so unit
# tests may unwrap freely while production code may not.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Hygiene. print_stdout and print_stderr are denied so that diagnostics go
# through the telemetry seam; the CLI opts out per item with a reason.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
integer_division = "warn"
rc_buffer = "warn"
str_to_string = "warn"
large_stack_arrays = "warn"
needless_collect = "warn"

# DELIBERATELY NOT ENABLED WORKSPACE WIDE: clippy::arithmetic_side_effects. It
# fires on every `+` between integers, which under `-D warnings` would make
# ordinary code unwritable and would train implementers to sprinkle `#[allow]`.
# It is enabled PER CRATE on the crates that parse attacker-controlled input
# (the HTTP, protocol, and configuration crates), where it is exactly right.
# Those crates carry `#![deny(clippy::arithmetic_side_effects)]` in lib.rs.

[profile.release]
# A proxy is one long-lived process; a slower build for a faster binary is
# always the right trade. LTO and one codegen unit matter most on the request
# path, which is a chain of small functions across crate boundaries that only
# cross-crate inlining can flatten.
lto = "fat"
codegen-units = 1
# panic = "unwind", the default, is DELIBERATE and must not be changed to
# "abort". Under unwind, tokio catches a panic at the task boundary: the one
# connection dies, the panic is logged and counted, and the process keeps
# serving. Under abort, a single panic on a single request from a single client
# terminates the whole proxy, which converts any residual panic bug anywhere in
# the tree into a remote denial of service. The no-panic rules exist so this
# never fires; this setting is what bounds the blast radius when they fail.
panic = "unwind"
# Keep line tables. A stripped binary turns the one panic we did not prevent
# into an unactionable incident. The size cost is small next to that.
strip = "none"
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
