#
# Pinned toolchain, so a local build and a CI build are the same build. The
# workspace MSRV (Cargo.toml rust-version) is 1.85, the edition-2024 floor,
# matching the sibling Iron projects; CI runs a separate job against 1.85 to
# prove the floor still holds.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
