# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The merge gate.
#
# This pipeline is designed against a specific adversary: a small language model
# that wants CI to be green more than it wants the code to be correct. Every
# lane below closes a way to get green without doing the work. In particular:
#
#   - No lane is gated by an `if:` on a repository variable. GitHub reports a
#     SKIPPED job to branch protection as SUCCESS, so a required check that can
#     be skipped is a check that can be turned green by unsetting a variable.
#     Lanes that have nothing to do yet RUN and assert the absence explicitly.
#   - Every lane that could pass vacuously (fuzz with no targets, benchmarks
#     with no benches, conformance with no suite) fails closed if its inputs
#     are missing, rather than reporting success for having found nothing.
#
# scripts/gate.sh runs the locally runnable subset in the same order.
name: ci

on:
  push:
    branches: [main]
    # A tag push is what `release-artifacts` (below) is gated on. Every
    # other job still runs too, unchanged: none of them is gated by `if:` on
    # the ref, per this file's own stated rule that a lane with nothing to
    # do yet still runs rather than reporting a skip that reads as a pass.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Reads scripts/feature-matrix.sh's declaration of which crates have
  # mutually exclusive feature groups (irontraffic-tls's three crypto-*
  # providers today) and turns it into the JSON that feature-matrix's own
  # job below consumes as a dynamic `strategy.matrix`. This is the ONLY place
  # that shape conversion happens; clippy/test/msrv below only need the bare
  # crate NAMES to exclude, which scripts/feature-matrix.sh matrixed-names
  # gives them directly without going through this job.
  feature-matrix-discover:
    name: discover the feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore scripts/feature-matrix.sh from the BASE branch
        # THE JUDGE MAY NOT BE EDITED BY THE DEFENDANT (same reasoning as the
        # invariants job below): this script decides WHICH feature
        # combinations the gate accepts as sufficient, so a pull request must
        # not be able to edit it and have that edit judge the very same run.
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.ref_name }}"
          if git cat-file -e "FETCH_HEAD:scripts/feature-matrix.sh" 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/feature-matrix.sh
          fi
          chmod +x scripts/feature-matrix.sh
      - id: discover
        run: |
          set -euo pipefail
          echo "matrix=$(scripts/feature-matrix.sh json)" >> "$GITHUB_OUTPUT"

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore scripts/feature-matrix.sh from the BASE branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.ref_name }}"
          if git cat-file -e "FETCH_HEAD:scripts/feature-matrix.sh" 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/feature-matrix.sh
          fi
          chmod +x scripts/feature-matrix.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (workspace, minus any crate with a feature matrix)
        # A crate with mutually exclusive features cannot compile under
        # --all-features at all (that is what "mutually exclusive" means), so
        # it is excluded here and checked once per valid combination by the
        # feature-matrix job below instead, never skipped. With nothing
        # matrixed this is `cargo clippy --workspace --all-targets
        # --all-features -- -D warnings`, unchanged.
        run: |
          set -euo pipefail
          exclude=()
          while IFS= read -r name; do
            [ -n "$name" ] && exclude+=(--exclude "$name")
          done < <(scripts/feature-matrix.sh matrixed-names)
          cargo clippy --locked --workspace "${exclude[@]}" --all-targets --all-features -- -D warnings

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Restore scripts/feature-matrix.sh from the BASE branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.ref_name }}"
          if git cat-file -e "FETCH_HEAD:scripts/feature-matrix.sh" 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/feature-matrix.sh
          fi
          chmod +x scripts/feature-matrix.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tests (workspace, all features, minus any crate with a feature matrix)
        run: |
          set -euo pipefail
          exclude=()
          while IFS= read -r name; do
            [ -n "$name" ] && exclude+=(--exclude "$name")
          done < <(scripts/feature-matrix.sh matrixed-names)
          cargo test --locked --workspace "${exclude[@]}" --all-features
      - name: doctests
        run: |
          set -euo pipefail
          exclude=()
          while IFS= read -r name; do
            [ -n "$name" ] && exclude+=(--exclude "$name")
          done < <(scripts/feature-matrix.sh matrixed-names)
          cargo test --locked --workspace "${exclude[@]}" --all-features --doc
      - name: default features build (the edge and k3s profile must not rot)
        # The data-plane-only build is what runs on constrained edge and k3s
        # nodes. It is built on every PR so that a dependency added to the
        # control plane cannot silently land in the data plane. A matrixed
        # crate (irontraffic-tls's three crypto-* providers today) activates
        # NONE of its exclusive features under --no-default-features, and
        # zero providers is itself a compile_error! by design, not an
        # accident: the crate requires exactly one. So this lane excludes
        # matrixed crates for the same reason the --all-features lanes above
        # do, and the feature-matrix job below already covers each of them
        # under this exact flag combination, once per valid provider.
        run: |
          set -euo pipefail
          exclude=()
          while IFS= read -r name; do
            [ -n "$name" ] && exclude+=(--exclude "$name")
          done < <(scripts/feature-matrix.sh matrixed-names)
          cargo check --locked --workspace "${exclude[@]}" --no-default-features

  dataplane-build:
    name: dataplane-only build, clippy, tests, and size ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Generous initial ceiling, not a measurement. It may only ratchet down.
      # The pull request implementing this issue records both measured sizes so
      # the first ratchet has a number.
      DATAPLANE_SIZE_CEILING_BYTES: 33554432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build the data-plane-only release binary
        run: |
          set -euo pipefail
          cargo build --locked -p irontraffic --no-default-features --features dataplane --release
          cp target/release/irontraffic /tmp/irontraffic-dataplane
      - name: clippy the data-plane-only build
        run: |
          set -euo pipefail
          cargo clippy --locked -p irontraffic --no-default-features --features dataplane --all-targets -- -D warnings
      - name: test the data-plane-only build
        run: |
          set -euo pipefail
          cargo test --locked -p irontraffic --no-default-features --features dataplane
      - name: build the default release binary for comparison
        run: |
          set -euo pipefail
          cargo build --locked -p irontraffic --release
      - name: assert the trimmed binary is not larger than the full binary or the ceiling
        run: |
          set -euo pipefail
          dp=$(wc -c < /tmp/irontraffic-dataplane)
          full=$(wc -c < target/release/irontraffic)
          echo "data-plane-only size: $dp bytes"
          echo "default build size:   $full bytes"
          echo "ceiling:              $DATAPLANE_SIZE_CEILING_BYTES bytes"
          test "$dp" -le "$full" || { echo "FAIL: the data-plane-only build is LARGER than the full build"; exit 1; }
          test "$dp" -le "$DATAPLANE_SIZE_CEILING_BYTES" || { echo "FAIL: the data-plane-only build exceeds the committed ceiling"; exit 1; }
          echo "size check: ok"

  feature-matrix:
    name: feature matrix (${{ matrix.crate }}, ${{ matrix.features }})
    needs: feature-matrix-discover
    if: needs.feature-matrix-discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.feature-matrix-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --locked -p "${{ matrix.crate }}" --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: test
        run: cargo test --locked -p "${{ matrix.crate }}" --no-default-features --features "${{ matrix.features }}"
      - name: doctests
        run: cargo test --locked -p "${{ matrix.crate }}" --no-default-features --features "${{ matrix.features }}" --doc

  # A required-checks branch protection rule names jobs, not matrix cells, and
  # a matrix job with zero entries (feature-matrix-discover finding nothing to
  # matrix) reports no runs at all rather than a single green one -- which,
  # exactly like the `if:` skip this file's own header warns about, GitHub
  # would otherwise treat as vacuously satisfied. This job always runs and
  # fails closed if the declared matrix and what actually executed disagree,
  # so branch protection has one steady job name to require regardless of how
  # many crates are matrixed today.
  feature-matrix-gate:
    name: feature matrix gate
    needs: [feature-matrix-discover, feature-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          declared='${{ needs.feature-matrix-discover.outputs.matrix }}'
          n=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$declared")
          result='${{ needs.feature-matrix.result }}'
          echo "declared matrix cells: $n"
          echo "feature-matrix job result: $result"
          if [ "$n" -eq 0 ]; then
            if [ "$result" != "skipped" ]; then
              echo "FAIL: nothing was declared but feature-matrix did not report skipped"
              exit 1
            fi
            echo "ok: no crate declares an exclusive-features group"
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "FAIL: $n feature-matrix cell(s) were declared but the job did not succeed"
            exit 1
          fi
          echo "ok: all $n declared feature-matrix cell(s) ran and passed"

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # rust-toolchain.toml pins a newer stable and outranks `rustup default`,
      # which would silently turn this lane into a no-op. RUSTUP_TOOLCHAIN
      # outranks the toolchain file, so the check genuinely runs under 1.89.
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - name: Restore scripts/feature-matrix.sh from the BASE branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.ref_name }}"
          if git cat-file -e "FETCH_HEAD:scripts/feature-matrix.sh" 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/feature-matrix.sh
          fi
          chmod +x scripts/feature-matrix.sh
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: check (workspace, minus any crate with a feature matrix)
        run: |
          set -euo pipefail
          exclude=()
          while IFS= read -r name; do
            [ -n "$name" ] && exclude+=(--exclude "$name")
          done < <(scripts/feature-matrix.sh matrixed-names)
          cargo check --locked --workspace "${exclude[@]}" --all-features --all-targets
      - name: check (crates with a feature matrix, once per combination)
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            scripts/feature-matrix.sh has-matrix "$manifest" || continue
            name=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^name[[:space:]]*=/{print $2; exit}' "$manifest")
            while IFS= read -r feat; do
              [ -n "$feat" ] || continue
              echo "== msrv check: $name --features $feat =="
              cargo check --locked -p "$name" --no-default-features --features "$feat" --all-targets
            done < <(scripts/feature-matrix.sh runs "$manifest" | grep -v -- '--all-features')
          done < <(git ls-files -- 'crates/*/Cargo.toml')

  musl:
    name: musl static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the musl target for the PINNED toolchain
        # rust-toolchain.toml pins the toolchain cargo actually uses, so the
        # target must be added through rustup (which honors the pin), not via
        # the action (which only equips its own toolchain).
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl -p irontraffic
      - name: Verify the binary is genuinely static
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/irontraffic
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -vq 'not a dynamic executable\|statically linked'; then
            echo "FAIL: binary is not static. A C dependency entered the tree."
            ldd "$BIN" || true
            exit 1
          fi
          echo "static: ok"

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  invariants:
    name: invariant lints, dash scan, governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: read (issue #589), added alongside contents: read from the
    # workflow default: the test census step below reads the live PR body to
    # find test-census-allow lines, the same permission the scope job already
    # declares for the identical reason.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout defaults to fetch-depth: 1, a single commit with
          # no history in common with origin/main. scripts/test-census.sh
          # (invoked below) needs a real merge base between HEAD and the base
          # branch to diff against, and git merge-base finds nothing between
          # two disconnected single-commit graphs. That was the entire cause
          # of this job failing on every open pull request: not a bug in the
          # census logic, a missing history.
          #
          # Full history is the correct fix, not a partial fetch of just the
          # base ref: a partial fetch would need to guess how deep to go, and
          # guessing wrong reintroduces this exact failure the day a PR sits
          # open through more commits than the guess covers. This repository
          # is small enough today that fetch-depth 0 costs a few extra seconds
          # per run. If that ever changes, the alternative is fetching only
          # the base ref with `git fetch origin <base>` and no depth limit
          # (equivalent correctness, less data), not a shallow depth guess.
          fetch-depth: 0
      - name: Restore every gate script and lint config from the BASE branch
        # THE JUDGE MAY NOT BE EDITED BY THE DEFENDANT.
        #
        # These scripts are executed BY this job, and until this step existed
        # they were executed from the pull request head. That meant a
        # contributor (in this repository, an autonomous coding agent) could
        # rewrite scripts/invariant-lints.sh to `exit 0`, rewrite its self-test
        # to agree, and pass every structural check in one commit. The gate
        # would report green while enforcing nothing, which is strictly worse
        # than having no gate, because the badge asserts a guarantee that is
        # not being provided.
        #
        # So: check the gate out of the base branch and run THAT. A PR may
        # still PROPOSE a change to a gate script; it simply cannot have that
        # change judge itself. The proposed version is reviewed by a human and
        # takes effect on the next PR, which is the correct order.
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.ref_name }}"
          for f in scripts/invariant-lints.sh scripts/invariant-lints-selftest.sh \
                   scripts/dash-scan.sh scripts/pr-scope-check.sh scripts/test-census.sh \
                   scripts/test-census-selftest.sh \
                   scripts/gate-fast.sh scripts/gate.sh scripts/feature-matrix.sh opencode.json \
                   clippy.toml deny.toml rustfmt.toml; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$f"
              echo "restored from base: $f"
            else
              echo "not on base yet (new file, will be judged from head): $f"
            fi
          done
          chmod +x scripts/*.sh
      - name: invariant lints (the structural rules clippy cannot express)
        run: scripts/invariant-lints.sh
      - name: invariant lint self-test
        # The lints are themselves code, and a lint that silently stops
        # matching is worse than no lint: it reports success forever. This
        # replays a corpus of deliberate violations and fails if any rule stops
        # firing, and replays a clean corpus and fails if any rule fires
        # spuriously. Without this, a bad refactor of a grep is undetectable.
        run: scripts/invariant-lints-selftest.sh
      - name: dash scan (no em dashes, no en dashes)
        run: scripts/dash-scan.sh
      - name: test census (tests may be added, never silently removed or weakened)
        # The 15 invariant lints are all PRESENT-TENSE greps over the current
        # tree, so they are structurally blind to deletion: removing a test
        # leaves a cleaner tree and passes every one of them. Weakening an
        # assertion passes too, since those lints check for presence rather
        # than strength. This compares the set of test function names, and the
        # assertion count per test file, against the base branch.
        #
        # PR_NUMBER and GH_TOKEN (issue #589): the script's own FAIL messages
        # have always told a reviewer to write a test-census-allow line in the
        # pull request body; nothing ever read it back until this. Empty on a
        # push event (github.event.pull_request is unset then), which the
        # script treats as "no allow-list", not "everything is allowed".
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/test-census.sh
      - name: test census self-test
        # Same reasoning as the invariant lint self-test above, for the
        # census instead of the greps: it used to be blind to a test with an
        # attribute between #[test] and fn, and separately blind to a
        # file's assertion count dropping all the way to zero. Both are
        # regression-tested here against the shipped script.
        run: scripts/test-census-selftest.sh
      - name: governance files present
        # These files are trust infrastructure. This lint ensures they cannot
        # be silently removed, renamed, or emptied.
        run: |
          set -euo pipefail
          for f in LICENSE LICENSE-APACHE LICENSE-MIT COVENANTS.md SECURITY.md \
                   CONTRIBUTING.md AGENTS.md ARCHITECTURE.md \
                   docs/WILL-NOT-IMPLEMENT.md docs/THREAT-MODEL.md; do
            test -s "$f" || { echo "missing or empty governance file: $f"; exit 1; }
          done
          echo "governance: ok"

  fuzz-discover:
    name: discover the fuzz matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      parsers: ${{ steps.discover.outputs.parsers }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        # FAILS CLOSED (1 and 2 of 4), unchanged in meaning from the serial job
        # this replaces. The other two live in the shard, because they are per
        # crate, and the aggregate is re-checked in the gate.
        run: |
          set -euo pipefail

          fuzz_manifests=()
          while IFS= read -r m; do
            [ -n "$m" ] && fuzz_manifests+=("$m")
          done < <(find crates -mindepth 3 -maxdepth 3 -type f -name Cargo.toml -path '*/fuzz/Cargo.toml' | sort)

          # The curated list of crates that MUST have a fuzz project is derived
          # from docs/THREAT-MODEL.md, not hardcoded here. See the long note in
          # the history of this file: CONTRIBUTING.md already requires every PR
          # shipping a parser over untrusted input to name that crate there, so
          # the threat model is the one place the list is maintained by a rule
          # this workflow does not have to duplicate.
          named_in_threat_model=()
          while IFS= read -r n; do
            [ -n "$n" ] && named_in_threat_model+=("$n")
          done < <(grep -oE '`irontraffic[a-zA-Z0-9_-]*`' docs/THREAT-MODEL.md | tr -d '`' | sort -u)

          parser_crates=()
          for name in "${named_in_threat_model[@]:-}"; do
            [ -n "$name" ] || continue
            [ -d "crates/$name" ] && parser_crates+=("$name")
          done
          echo "parser crates named in docs/THREAT-MODEL.md that exist under crates/: ${parser_crates[*]:-none}"

          # FAILS CLOSED (1 of 4): every parser crate on record must have its own
          # fuzz project.
          missing=()
          for name in "${parser_crates[@]:-}"; do
            # `[ -n "$name" ] || continue` is NOT decoration. Under `set -u` an
            # empty array expands via `${a[@]:-}` to ONE empty-string element, so
            # without this guard a zero-parser tree produces `missing=("")`,
            # `${#missing[@]}` is 1, and discovery hard-fails with a message that
            # names no crate at all. The loop above has this guard; this one did
            # not, which made main's own "no parser crate is on record yet"
            # exit-0 branch unreachable for as long as it has existed.
            [ -n "$name" ] || continue
            [ -f "crates/$name/fuzz/Cargo.toml" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "FAIL: parser crate(s) with no crates/<name>/fuzz/Cargo.toml: ${missing[*]}"
            exit 1
          fi

          # FAILS CLOSED (2 of 4): discovery must not go blind. Zero fuzz projects
          # while a parser crate is on record is the vacuous-success shape this
          # whole lane exists to refuse.
          if [ "${#fuzz_manifests[@]}" -eq 0 ] && [ "${#parser_crates[@]}" -gt 0 ]; then
            echo "FAIL: a parser crate is on record (${parser_crates[*]}) but no crates/*/fuzz/Cargo.toml exists."
            exit 1
          fi

          dirs=()
          for manifest in "${fuzz_manifests[@]:-}"; do
            [ -n "$manifest" ] && dirs+=("$(dirname "$manifest")")
          done
          # NOT `| grep -v '^$' |`. grep exits 1 when it selects nothing, and
          # under `set -o pipefail` that kills the job before the matrix is ever
          # written, so a legitimately empty tree died instead of emitting `[]`.
          # The python filter already drops blank lines, so grep was redundant as
          # well as fatal.
          matrix="$(printf '%s\n' "${dirs[@]:-}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "fuzz matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "parsers=${#parser_crates[@]}" >> "$GITHUB_OUTPUT"

  fuzz-shard:
    name: fuzz ${{ matrix.dir }}
    needs: fuzz-discover
    if: needs.fuzz-discover.outputs.matrix != '[]'
    strategy:
      # fail-fast MUST stay false, but NOT for the reason first written here.
      # The original claim was that a cancelled sibling would confuse the gate.
      # It would not: GitHub aggregates matrix leg conclusions with failure
      # outranking cancelled, so a failing leg that cancels its siblings still
      # yields `failure` and the gate refuses for the right reason either way.
      #
      # The real reason is coverage of crashes. With fail-fast on you see ONE
      # crash and must re-run to learn whether the other eight crates also crash,
      # and surfacing crashes is the entire purpose of this lane. The cost is
      # that a genuine crash burns the full set of shards rather than stopping
      # early, which is a fair price for seeing every crash in one run.
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.fuzz-discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    # 20 per SHARD, not 45 for the whole lane. The serial job this replaces grew
    # at 73 seconds per target against one fixed deadline and crossed it at 20
    # targets (see #697). Sharded, the wall clock is the slowest single crate, so
    # the deadline stops being a function of how much the project has been fuzzed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # KEYED PER SHARD. rust-cache derives its key from GITHUB_JOB, which is
          # `fuzz-shard` for every matrix leg, so without this all nine shards
          # computed one identical key, all restored whichever crate happened to
          # save last, and eight of nine logged "Failed to save: Unable to reserve
          # cache ... another job may be creating this cache" on every run.
          # The lane would then permanently hold one arbitrary crate's artifacts
          # while the other eight rebuilt their instrumented fuzz targets from
          # scratch, paid straight out of the wall clock this sharding exists to
          # buy. Measured on the live run of this branch before the fix.
          key: ${{ matrix.dir }}
      - name: Run every declared fuzz target in this crate briefly
        env:
          # RUSTUP_TOOLCHAIN is set because rust-toolchain.toml pins a stable
          # version and that pin OUTRANKS the toolchain action above. Installing
          # nightly is not the same as using it: without this the action installs
          # nightly, the pin quietly wins, and cargo-fuzz dies on "the option Z is
          # only accepted on the nightly compiler" while the job looks correctly
          # configured.
          RUSTUP_TOOLCHAIN: nightly
          # VIA env, NEVER interpolated into the script body. `${{ }}` is textual
          # substitution performed BEFORE bash sees the line, so a repository
          # controlled directory name lands as shell source. In a double-quoted
          # context that makes `$(...)` and backticks live; in a single-quoted one
          # a lone quote ends the string and the rest is parsed as commands.
          FUZZ_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          fuzz_dir="$FUZZ_DIR"
          manifest="$fuzz_dir/Cargo.toml"
          [ -f "$manifest" ] || { echo "FAIL: $manifest vanished between discovery and this shard."; exit 1; }

          cargo install cargo-fuzz --locked

          ran_names=()
          echo "== discovering targets in $fuzz_dir =="
          targets="$(cargo fuzz list --fuzz-dir "$fuzz_dir")"
          # FAILS CLOSED (3 of 4): a fuzz project that declares zero targets is
          # the other vacuous-success shape, an empty fuzz/ that exists only to
          # satisfy check 1 without ever running anything.
          if [ -z "$targets" ]; then
            echo "FAIL: $manifest exists but declares no targets."
            exit 1
          fi

          # FAILS CLOSED (5 of 5): every fuzz_targets/*.rs must be REGISTERED, and
          # every registration must name a file that exists.
          #
          # `cargo fuzz list` enumerates `[[bin]]` stanzas, not files on disk. So a
          # target could be written, reviewed and merged, sit in fuzz_targets/
          # looking present to any reader of the directory, and never run once.
          # That is exactly what happened to fuzz_path.rs from #29/#512 until #699:
          # 21 target files against 20 registered bins, and the unregistered one
          # covered `NormalizedPath::parse_into`, the CVE-2025-66490 encoded-dot
          # path, which is the highest risk parser in the crate.
          #
          # None of the four checks above could see it. Each asks "is there at
          # least one" (one fuzz project per parser crate, one target per project,
          # one run recorded) and none asks "is every target file accounted for".
          # A lane can therefore report success while a security surface is
          # entirely unfuzzed, which is the vacuous-success shape this whole job
          # exists to refuse.
          # NOT `-maxdepth 1 -type f`. Both predicates opened holes in BOTH
          # directions: an unregistered target in a subdirectory, or one that is a
          # symlink, was invisible and passed; while a legitimately nested or
          # symlinked target that IS registered failed with "no matching
          # fuzz_targets/*.rs", which is untrue and would redden the lane for a
          # maintainer who did nothing wrong.
          on_disk="$(find -L "$fuzz_dir/fuzz_targets" -name '*.rs' \( -type f -o -type l \) 2>/dev/null | sed 's|.*/||; s|\.rs$||' | sort)"
          registered="$(printf '%s\n' "$targets" | sort)"
          unregistered="$(comm -23 <(printf '%s\n' "$on_disk") <(printf '%s\n' "$registered"))"
          missing_file="$(comm -13 <(printf '%s\n' "$on_disk") <(printf '%s\n' "$registered"))"
          if [ -n "$unregistered" ]; then
            echo "FAIL: $fuzz_dir has target file(s) with no [[bin]] entry, so they never run:"
            printf '  %s\n' $unregistered
            echo "  Add a [[bin]] stanza naming each, or delete the file. A target that"
            echo "  cannot run is worse than no target: it reads as coverage that does not exist."
            exit 1
          fi
          if [ -n "$missing_file" ]; then
            echo "FAIL: $fuzz_dir registers [[bin]] target(s) with no matching fuzz_targets/*.rs:"
            printf '  %s\n' $missing_file
            exit 1
          fi
          # AND EVERY REGISTRATION MUST POINT AT ITS OWN FILE.
          #
          # The set comparison above compares `cargo fuzz list` NAMES against file
          # BASENAMES and never reads the `path` key, which is what cargo actually
          # compiles. So a `[[bin]]` carrying the right NAME whose `path` points at
          # a DIFFERENT existing target satisfies set equality exactly, and the
          # file it is supposed to build never compiles or runs. The shard then
          # prints `== fuzzing ... :: fuzz_path ==` and `Done N runs` for a target
          # that was never built, and the log is indistinguishable from a real run.
          #
          # That is the same silently-unrun target this check exists to prevent,
          # reachable by the same copy-paste slip that produced #699: the stanzas
          # in these manifests are identical blocks, so copying one, updating
          # `name` and forgetting `path` is the mirror image of the original bug.
          # Cargo does NOT backstop it: a cross-pointed manifest builds cleanly.
          # Cargo only catches the weaker case where `path` is omitted entirely.
          #
          # Verified by binary content rather than by reasoning: with the path
          # cross-pointed, the compiled `fuzz_path` binary contained zero
          # occurrences of the assertion string unique to fuzz_path.rs.
          bad_paths="$(python3 - "$manifest" <<'PYEOF'
          import sys, tomllib
          m = tomllib.load(open(sys.argv[1], "rb"))
          for b in m.get("bin", []):
              name, path = b.get("name", ""), b.get("path", "")
              if not name:
                  print("a [[bin]] stanza has no name")
              elif path != "fuzz_targets/%s.rs" % name:
                  print('[[bin]] "%s" has path "%s", expected fuzz_targets/%s.rs' % (name, path, name))
          PYEOF
          )"
          if [ -n "$bad_paths" ]; then
            echo "FAIL: $manifest has [[bin]] entries that do not point at their own target file:"
            printf '  %s\n' "$bad_paths"
            echo "  A stanza whose path names a DIFFERENT file compiles and runs that other"
            echo "  file under this name, so the target it claims to cover never runs at all."
            exit 1
          fi
          echo "ok: every target file in $fuzz_dir is registered, and every registration points at its own file"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "== fuzzing $fuzz_dir :: $t =="
            # crates/irontraffic-conn/fuzz (issue #573): building this fuzz
            # crate's only dependency, irontraffic-conn, which pulls in
            # tokio with rt-multi-thread for the crate's real accept loop,
            # hits a deterministic rustc ICE on this job's nightly toolchain
            # (rustc_codegen_ssa/mir/operand.rs:291, "not immediate" on
            # tokio's Notified<Arc<Handle>> type), reproduced identically
            # across multiple runs, so it is a compiler defect, not
            # flakiness.
            #
            # Any fuzz crate whose dependency graph includes tokio can hit
            # a deterministic rustc ICE on this job's nightly toolchain
            # (rustc_codegen_ssa/mir/operand.rs:291, "not immediate" on
            # tokio's Notified<Arc<Handle>> type) simply by compiling
            # tokio's multi-thread runtime under this job's default build.
            # Confirmed independently on two unrelated crates:
            # crates/irontraffic-conn/fuzz (tokio via its own real accept
            # loop) and crates/irontraffic-config/fuzz (tokio transitively
            # via irontraffic-runtime). Detected rather than hand-listed,
            # because a hand-maintained list already missed the second
            # case once (see history below) and the workspace has more
            # crates that transitively depend on tokio, via
            # irontraffic-runtime or otherwise, than fuzz crates that have
            # hit this so far.
            #
            # History, so the next person does not repeat either mistake:
            # `--sanitizer none` alone (first attempt, issue #573) was
            # verified only against a tree where the affected crate's
            # fuzz/ did not exist yet, a false pass; the real run against
            # the actual crate hit the identical ICE, and separately, the
            # same `--sanitizer none`-only fix applied by hand to
            # crates/irontraffic-config/fuzz (issue #582) hit it too, on
            # PR #574, the same way. `--strip-dead-code false` is the
            # corrected attempt: `cargo fuzz run --help` names dead-code
            # stripping (default on) as a known cause of "unexpected
            # behavior or even ICEs in the compiler", which matches this
            # crash's shape (an OperandRef(Uninit ...) on a niche-optimized
            # type nothing in any of these fuzz targets can ever reach)
            # better than the sanitizer theory did. `--sanitizer none` is
            # kept alongside it: still free for every crate this applies
            # to, because none of their fuzz targets construct or enter a
            # tokio runtime, so ASan was never able to find anything in
            # tokio's own compiled code from any of them regardless.
            #
            # `cargo tree -p tokio` only resolves dependencies; it does not
            # compile or codegen anything, so it cannot itself trip the
            # ICE it is checking for. Exit 0 means tokio is somewhere in
            # this fuzz crate's graph.
            extra_fuzz_args=()
            if cargo tree --manifest-path "$manifest" -p tokio >/dev/null 2>&1; then
              extra_fuzz_args=(--sanitizer none --strip-dead-code false)
            fi
            # `${extra_fuzz_args[@]+"${extra_fuzz_args[@]}"}`, not the plain
            # `"${extra_fuzz_args[@]}"` this started as: under `set -u`, an
            # empty array expands to an "unbound variable" error on bash
            # older than 4.4 even when quoted, which this script cannot
            # assume it will never run under. Verified directly (both the
            # empty and the populated case) before trusting it, the same
            # way the invariant lints and the scope check's merge-base
            # fallback in this repository were.
            cargo fuzz run --fuzz-dir "$fuzz_dir" ${extra_fuzz_args[@]+"${extra_fuzz_args[@]}"} "$t" -- -max_total_time=60 -timeout=10
            ran_names+=("$fuzz_dir :: $t")
          done <<< "$targets"

          echo "fuzz: ran ${#ran_names[@]} target(s) in $fuzz_dir:"
          for n in "${ran_names[@]:-}"; do
            [ -n "$n" ] && echo "  - $n"
          done

          # FAILS CLOSED (4 of 4), per shard. A future edit to the loop that
          # skips appending to ran_names cannot silently drop to zero runs and
          # still exit 0.
          if [ "${#ran_names[@]}" -eq 0 ]; then
            echo "FAIL: zero fuzz targets ran in $fuzz_dir."
            exit 1
          fi

  fuzz:
    # THE NAME ON THE NEXT LINE IS LOAD BEARING AND MUST NOT CHANGE.
    #
    # It is a required status check in this repository's branch protection.
    # Branch protection waits forever on a context no job produces, which is not
    # a visible failure: it presents as "Expected, waiting for status to be
    # reported" and every pull request silently becomes unmergeable. That exact
    # failure is live right now for a DIFFERENT context, `msrv (1.85)`, which was
    # renamed to `msrv (1.89)` and left stale in the protection rule. See #698.
    # So this is not a hypothetical worry: it is the second time in one file.
    #
    # The shards above are named separately and are NOT required checks. This
    # job is the only thing branch protection sees, and it is a pure aggregator.
    name: fuzz (smoke, fails closed on a missing corpus)
    needs: [fuzz-discover, fuzz-shard]
    # `always()` so this still runs when a shard fails, is skipped, or is never
    # scheduled. Without it, a skipped shard would skip the gate too, and a
    # skipped required check reports as neutral rather than failing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          # EVERY ONE OF THESE COMES IN VIA env, NOT VIA `${{ }}` IN THE SCRIPT.
          #
          # `declared` is built from directory names found under crates/, so it is
          # repository controlled. Interpolated directly it was a shell injection
          # into the one job branch protection actually reads: a directory named
          #     x'; exit 0; #
          # closed the quote and ran `exit 0`, so this required check reported
          # SUCCESS, having verified nothing, while shards were failing next to
          # it. That is the vacuous-success shape the comments below say this
          # lane exists to refuse, in the lane itself.
          #
          # An env value is passed through the environment rather than pasted
          # into the script text, so the shell never parses it as source.
          DECLARED: ${{ needs.fuzz-discover.outputs.matrix }}
          PARSERS: ${{ needs.fuzz-discover.outputs.parsers }}
          DISCOVER_RESULT: ${{ needs.fuzz-discover.result }}
          SHARD_RESULT: ${{ needs.fuzz-shard.result }}
        run: |
          set -euo pipefail
          declared="$DECLARED"
          parsers="$PARSERS"
          discover_result="$DISCOVER_RESULT"
          shard_result="$SHARD_RESULT"
          echo "discover result: $discover_result"
          echo "parser crates on record: $parsers"
          echo "fuzz-shard result: $shard_result"

          # Discovery itself failing or being cancelled is a gate failure. Without
          # this, a cancelled discover yields an empty matrix and the zero branch
          # below would read it as "nothing to fuzz" and pass.
          if [ "$discover_result" != "success" ]; then
            echo "FAIL: the discovery job did not succeed (it was $discover_result), so the matrix is not trustworthy."
            exit 1
          fi

          # Parsed AFTER the check above, deliberately. When discovery fails its
          # output is the empty string, and parsing that first died in python with
          # a traceback: the exit code was right but the log said nothing useful.
          n=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$declared")
          echo "declared fuzz crates: $n"

          if [ "$n" -eq 0 ]; then
            if [ "$parsers" != "0" ]; then
              echo "FAIL: $parsers parser crate(s) are on record but no fuzz crate was discovered."
              exit 1
            fi
            if [ "$shard_result" != "skipped" ]; then
              echo "FAIL: nothing was declared but fuzz-shard did not report skipped (it was $shard_result)."
              exit 1
            fi
            echo "ok: no parser crate is on record yet and no fuzz project exists. Nothing to fuzz."
            exit 0
          fi

          # ANYTHING THAT IS NOT `success` REFUSES, which is the whole point of
          # aggregating. `failure` is the obvious one. `cancelled` is what a job
          # timeout looks like here, and it is visually identical to a superseded
          # push. `skipped` is what a shard that never ran reports. A matrix gate
          # that checks only `failure()` reports green when a shard never ran,
          # and that is precisely the vacuous-success shape the four checks above
          # were written to refuse.
          if [ "$shard_result" != "success" ]; then
            echo "FAIL: $n fuzz crate(s) were declared but the shard job did not succeed (it was $shard_result)."
            echo "  A cancelled or skipped shard is as unmet as a failed one."
            exit 1
          fi
          echo "ok: all $n declared fuzz crate(s) ran and passed"

  scope:
    name: PR scope check (the diff matches the issue)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the ONE lane with a job-level `if`, and it is safe for a reason
    # that does not generalize: a push event has no pull request, so there is
    # genuinely nothing to check, and direct pushes to main are blocked by
    # branch protection anyway. Every other lane runs unconditionally, because
    # GitHub reports a skipped job to branch protection as SUCCESS and a gate
    # that can be skipped into a pass asserts a guarantee it is not providing.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore pr-scope-check.sh from the BASE branch
        # THE JUDGE MAY NOT BE EDITED BY THE DEFENDANT, the same rule the
        # invariants job applies to the other gate scripts, and it was NOT
        # actually being applied here.
        #
        # The invariants job's restore step lists scripts/pr-scope-check.sh
        # among the files it checks out from the base branch, but that job
        # never runs pr-scope-check.sh. It only restores the file into ITS OWN
        # job workspace, on its own runner, and then does nothing further with
        # it. The actual execution of pr-scope-check.sh happens here, in this
        # separate job, on a separate runner with a separate checkout, and
        # this job had no restore step of its own. So a PR could rewrite
        # scripts/pr-scope-check.sh to exit 0 unconditionally, or to widen its
        # allowlist to match anything, and that rewritten copy is exactly what
        # would have judged it, unnoticed, because the invariants job's
        # restore of the same filename created the appearance of protection
        # without providing it.
        #
        # A PR may still PROPOSE a change to this script, same as any other
        # gate script; it takes effect on the next PR once a human has
        # reviewed it, not on the PR that introduces it.
        #
        # Fetch the EXACT base commit (issue #535), not the base branch NAME.
        # This job only ever runs on `pull_request` (the job level `if` above),
        # so `github.event.pull_request.base.sha` is always set. The step below
        # that actually compares files uses that identical SHA as `BASE_SHA`.
        # Fetching by branch name instead used to mean this step and that
        # comparison could silently disagree the moment another pull request
        # merged into the base branch in between: this fetch would pick up
        # whatever the base branch's tip happened to be at that instant, which
        # is not necessarily the commit `BASE_SHA` names once the base branch
        # has moved past it. `git merge-base` then has no path to a shared
        # ancestor for a commit it never actually fetched, and
        # scripts/pr-scope-check.sh's own fallback silently substituted
        # `BASE_SHA` for the merge base, producing a two dot diff that blamed
        # this pull request for whatever DID land on the base branch in that
        # window (found on PR #512, which was told it changed files belonging
        # to issue #113's already merged SNI normalization work). Fetching the
        # SHA directly ties both steps to the same immutable commit no matter
        # how many merges land on the base branch in between.
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "FETCH_HEAD:scripts/pr-scope-check.sh" 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/pr-scope-check.sh
            echo "restored from base: scripts/pr-scope-check.sh"
          else
            echo "not on base yet (new file, will be judged from head): scripts/pr-scope-check.sh"
          fi
          chmod +x scripts/pr-scope-check.sh
      - name: Compare the changed files against the issue's Files table
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/pr-scope-check.sh

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json
      - run: ./scripts/dashboard-gate.sh --selftest
      - run: ./scripts/dashboard-gate.sh

  # Created here exactly as specified in `bench-competitor-compare-script`
  # (#425), which this repository does not have yet: no toolchain and no
  # cache step, by that same specification, because this job's whole point
  # is to be fast enough to block every pull request. A future issue adding
  # its own `*-selftest.sh` adds one step here and changes nothing else,
  # per the same instruction this row itself was added under.
  shell-selftests:
    name: shell-selftests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # See release-artifacts's identical comment: lets
      # supply-chain-selftest.sh's cosign-dependent tests get a real
      # ambient identity on every same-repository run (pull request or
      # push), not only on a tag.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh scripts/release/release-selftest.sh
      - name: Install cosign
        # Same pin as release-artifacts's identical step, kept in
        # agreement deliberately rather than each drifting independently.
        run: |
          set -euo pipefail
          cv=v2.6.4
          bin=/usr/local/bin/cosign
          sum="309779b0c4e409186b0a80daba99041fe2cf65a920ce645013901df6211895a9"
          if ! curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
                 --retry 5 --retry-all-errors \
                 "https://github.com/sigstore/cosign/releases/download/$cv/cosign-linux-amd64" -o "$bin"; then
            echo "github.com releases unreachable; falling back to this project's pinned mirror"
            curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
              --retry 5 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/toolchains/cosign-linux-amd64" -o "$bin"
          fi
          echo "$sum  $bin" | sha256sum -c -
          chmod +x "$bin"
      - run: sh scripts/release/supply-chain-selftest.sh

  # Tag-triggered: builds the four-target release matrix, verifies
  # reproducibility and the static/dynamic linkage invariants, and publishes
  # the tarballs and SHA256SUMS as a GitHub release. See docs/RELEASE.md.
  #
  # No `ring-provider` matrix entry: the design this issue was written
  # against assumes `crates/irontraffic` already selects a TLS crypto
  # provider (an `aws-lc-rs` default and this `ring-provider` fallback
  # feature). It does not; the crate has no `ring-provider` feature, no
  # `tls` feature, and does not depend on `crates/irontraffic-tls` at all
  # (see docs/RELEASE.md's "What this table does not yet say" section for
  # the full accounting). Adding a CI step that passes
  # `--no-default-features --features ring-provider` to a crate with no
  # such feature fails every run; inventing an inert feature that toggles
  # nothing would be exactly the kind of untested "we have a fallback"
  # claim this issue's own Context section warns against. A future issue
  # that wires TLS into this crate is what makes this matrix entry addable
  # for real.
  release-artifacts:
    name: release artifacts
    # Runs on tags AND on pull requests, deliberately.
    #
    # Gating the whole job on a tag meant the four target build, the
    # reproducibility check, the static-linking checks and the allowlist check
    # were never executed by any run a reviewer could see, so `merge-guard`
    # refused the PR: a skipped required check is as unmet as a failing one. It
    # also meant a defect in this job could only surface while cutting a real
    # release. That is exactly what happened: a review found `build-matrix.sh`
    # dirtied the worktree before the first build, poisoning the git-dirty stamp
    # on every artifact, and the repair for it would have gone unexercised until
    # the next tag.
    #
    # Only PUBLISHING is tag-gated now; everything that can fail without a
    # release existing runs on every pull request.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # id-token: write is what lets cosign obtain a short-lived Fulcio
      # certificate from this job's own ambient GitHub Actions OIDC
      # identity (release-sbom-signing-and-provenance, #428). GitHub
      # withholds this from a fork pull request's run regardless of what
      # a workflow requests, which is a platform security boundary, not a
      # setting this file controls; the sign/attest steps below detect
      # that absence at runtime and print why, rather than being gated
      # here by an `if:` on the actor or repository, which this file's own
      # header rule warns against (a required check gated on a repository
      # variable is a check that can be turned green by unsetting it).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job holds `contents: write` (needed by the `gh release
          # create` step below) and, unlike its sibling `shell-selftests`
          # job, downloads and extracts a third-party archive with `sudo`
          # before that step runs. A compromised tarball executing in a
          # context that also holds a repo-rewriting, release-publishing
          # credential is exactly the shape a supply-chain issue like this
          # one exists to close off. The `gh release create` step
          # authenticates via the `GH_TOKEN` environment variable it sets
          # explicitly, not via a git-credential-helper token this checkout
          # would otherwise persist, so turning persistence off here costs
          # that step nothing.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the cross toolchains the three non-native targets need
        # x86_64-unknown-linux-gnu is this runner's own native target and
        # needs nothing extra. The other three each need one thing:
        # musl-tools gives x86_64-unknown-linux-musl its musl-gcc,
        # gcc-aarch64-linux-gnu gives aarch64-unknown-linux-gnu a cross
        # linker, and aarch64-unknown-linux-musl has no apt package on this
        # runner at all, so its cross toolchain is downloaded prebuilt from
        # musl.cc, the same community-maintained source most Rust release
        # workflows targeting this exact combination use. That download is
        # pinned by checksum and verified BEFORE anything extracts or
        # executes it, unlike every other input to this release (the
        # rustc toolchain via `rust-toolchain.toml`, every crate via
        # `Cargo.lock`): musl.cc serves no signature and this project
        # controls no mirror of it, so a content hash, checked here, is the
        # floor for a build input this pipeline cannot otherwise pin. The
        # hash below was computed by downloading the real, current asset
        # directly (`curl ... | sha256sum`) rather than copied from
        # anywhere claiming to already be a checksum for it; bumping the
        # pin (musl.cc updating the file) is a reviewed change, the same
        # posture `rust-toolchain.toml` takes for the compiler.
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # Two sources, one checksum.
          #
          # musl.cc is a community host with no SLA and no mirror, and it is
          # demonstrably not reachable from this runner: the first pull request
          # run of this job (after it stopped being tag gated) failed with
          # `curl: (28) Failed to connect to musl.cc port 443 after 135045 ms`,
          # while the same URL answered in 0.33 seconds from a developer
          # machine. So it is blocked or rate limited from Actions rather than
          # briefly down, and retrying it alone would fail every release the
          # same way. Had this job stayed tag gated, that failure would have
          # landed while cutting a version.
          #
          # The fallback is an asset this project controls. The sha256 pin
          # below gates BOTH paths and is checked before anything extracts or
          # executes, so a mirror cannot substitute different bytes: the worst a
          # compromised mirror achieves is failing the build.
          tb=/tmp/aarch64-linux-musl-cross.tgz
          sum="c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38"
          if ! curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 300 \
                 --retry 5 --retry-all-errors \
                 https://musl.cc/aarch64-linux-musl-cross.tgz -o "$tb"; then
            echo "musl.cc unreachable; falling back to this project's pinned mirror"
            curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 300 \
              --retry 5 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/toolchains/aarch64-linux-musl-cross.tgz" \
              -o "$tb"
          fi
          echo "$sum  $tb" | sha256sum -c -
          sudo tar -xzf "$tb" -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
      - name: Install cosign
        # Two sources, one checksum, the same posture as the
        # aarch64-linux-musl-cross download above and for the identical
        # reason: cosign's own install script serves no signature over
        # itself we could check instead, so a content hash pinned here,
        # computed from a real download rather than copied from anywhere
        # claiming to already be a checksum for it, is the floor. The
        # sigstore-installed release binary is used directly rather than
        # `go install`, so no Go toolchain is added to this job only to
        # build one tool.
        run: |
          set -euo pipefail
          cv=v2.6.4
          bin=/usr/local/bin/cosign
          sum="309779b0c4e409186b0a80daba99041fe2cf65a920ce645013901df6211895a9"
          if ! curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
                 --retry 5 --retry-all-errors \
                 "https://github.com/sigstore/cosign/releases/download/$cv/cosign-linux-amd64" -o "$bin"; then
            echo "github.com releases unreachable; falling back to this project's pinned mirror"
            curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
              --retry 5 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/toolchains/cosign-linux-amd64" -o "$bin"
          fi
          echo "$sum  $bin" | sha256sum -c -
          chmod +x "$bin"
          cosign version
      - name: Build the four-target matrix
        run: sh scripts/release/build-matrix.sh dist
      - name: Verify reproducibility (x86_64-unknown-linux-gnu)
        run: sh scripts/release/verify-repro.sh x86_64-unknown-linux-gnu
      - name: Generate a CycloneDX SBOM per artifact
        # Runs unconditionally, on every pull request and every tag: it
        # needs no network beyond crates.io (already required to build the
        # matrix above) and no identity, so there is nothing here that can
        # only fail while cutting a real release.
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            base="$(basename "$f")"
            target="${base#irontraffic-*-}"
            target="${target%.tar.gz}"
            sh scripts/release/sbom.sh "$target" "control-plane" "$f.sbom.json"
            echo "generated $f.sbom.json"
          done
      - name: Assert every SBOM's licence set is a subset of the allowlist
        run: |
          set -euo pipefail
          for f in dist/*.sbom.json; do
            sh scripts/release/sbom-licence-check.sh "$f"
          done
      - name: Sign every published artifact and SBOM
        # Exercised on every pull request from this repository, not only on
        # a tag: cosign's ambient GitHub Actions OIDC provider issues a
        # real, distinctly-identified certificate for ANY run with
        # `id-token: write` granted (subject
        # ".../ci.yml@refs/pull/N/merge" on a pull request,
        # ".../ci.yml@refs/tags/vX.Y.Z" on a tag), and only the tag form
        # matches verify.sh's pinned --certificate-identity-regexp, so a
        # pull-request run signing here proves the mechanism works without
        # ever producing a signature that could pass as a release one. A
        # fork pull request's run gets no ambient token at all (a GitHub
        # platform restriction, not a setting this file controls), which
        # sign.sh itself detects and refuses fast; this step lets that
        # specific, structural case through rather than failing the whole
        # required check on every external contribution.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no ambient GitHub Actions OIDC token (expected on a fork pull" >&2
            echo "  request); skipping signing. A same-repository run always has one." >&2
            exit 0
          fi
          sh scripts/release/sign.sh dist/*.tar.gz dist/*.sbom.json
      - name: Build SHA256SUMS and sign it too
        run: |
          set -euo pipefail
          ( cd dist && sha256sum *.tar.gz *.sbom.json > SHA256SUMS )
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no ambient GitHub Actions OIDC token; skipping signing SHA256SUMS." >&2
            exit 0
          fi
          sh scripts/release/sign.sh dist/SHA256SUMS
      - name: Assert every published file has exactly one signature
        # Invariant 6: the release job enumerates its own outputs and
        # asserts one signature each, rather than trusting the sign step
        # above to have covered everything it claimed to.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no ambient GitHub Actions OIDC token; nothing was signed to enumerate." >&2
            exit 0
          fi
          missing=0
          for f in dist/*.tar.gz dist/*.sbom.json dist/SHA256SUMS; do
            sig_count=0
            [ -f "$f.bundle" ] && sig_count=$((sig_count + 1))
            if [ "$sig_count" -ne 1 ]; then
              echo "FAIL: $f has $sig_count signature(s), want exactly 1" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "every published file has exactly one signature"
      - name: Produce a build provenance attestation per artifact
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no ambient GitHub Actions OIDC token (expected on a fork pull" >&2
            echo "  request); skipping attestation." >&2
            exit 0
          fi
          for f in dist/*.tar.gz; do
            base="$(basename "$f")"
            target="${base#irontraffic-*-}"
            target="${target%.tar.gz}"
            sh scripts/release/attest.sh "$f" "$target" "control-plane"
          done
      - name: Verify signature and provenance over the freshly signed dist/ (tag only)
        # This is scripts/release/verify.sh's own SUCCESS path, run for
        # real, the same way the step above (verify-repro.sh) already
        # closes the reproducibility loop. Tag-gated, not merely
        # OIDC-token-gated like every other step in this job: verify.sh's
        # --certificate-identity-regexp is pinned to refs/tags/v*, so it can
        # never pass against a pull request's own identity
        # (.../ci.yml@refs/pull/N/merge) even with a perfectly real
        # signature; running it there would fail this required check on
        # every pull request for the correct-but-wrong reason.
        # supply-chain-selftest.sh's own tests 15/16 verify a pull request's
        # real signature with cosign directly for exactly this reason (see
        # that file's own header comment on WHY THESE TWO TESTS DO NOT CALL
        # verify.sh), which means this tag-only step is the ONLY place the
        # actual consumer script a user runs is ever exercised against a
        # real signature end to end, not a round trip through the signer's
        # own inputs. Every companion file (.bundle, .intoto.bundle,
        # .sbom.json, SHA256SUMS) is found locally, right next to each
        # tarball in dist/, so this needs no network fetch at all.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            sh scripts/release/verify.sh --artifact "$f" --sbom "$f.sbom.json" --strict
          done
          echo "verify.sh --strict: ok (every tarball, real signature, real provenance)"
      - name: Verify the musl binaries are fully static
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            f="target/$t/release/irontraffic"
            echo "== $t =="
            file "$f"
            if [ "$t" = "x86_64-unknown-linux-musl" ]; then
              # Native architecture: this runner's `ldd` genuinely invokes
              # the dynamic loader against the file, so its verdict is
              # meaningful here. The pattern matches this repository's own
              # proven, green `musl` job above verbatim (not the narrower
              # one this job shipped with): glibc's `ldd` classifies a
              # static-PIE binary (this project's actual shape; `file`
              # reports "static-pie linked") as "statically linked", not
              # "not a dynamic executable", and the narrower pattern would
              # abort a genuinely static artifact on exactly that wording.
              if ldd "$f" 2>&1 | grep -vq 'not a dynamic executable\|statically linked'; then
                echo "FAIL: $f is not static. A C dependency entered the tree."
                ldd "$f" || true
                exit 1
              fi
            else
              # Foreign architecture: unlike the native case above, `ldd`
              # here does not merely read headers, it works by trying to
              # resolve and invoke the aarch64 dynamic loader, which this
              # x86_64 runner cannot actually do; its output is therefore
              # not a reliable verdict at all, and was untested by this
              # repository until this job's own first tagged run. The
              # PT_INTERP program header is what a dynamic linker needs to
              # run a binary in the first place, and its absence is
              # classifiable by reading the ELF program headers alone,
              # which needs no execution and no architecture match.
              if readelf -lW "$f" | grep -q 'INTERP'; then
                echo "FAIL: $f has a PT_INTERP program header; it is dynamically linked."
                readelf -lW "$f" || true
                exit 1
              fi
            fi
          done
          echo "static: ok"
      - name: Verify the gnu binaries link only the committed allowlist
        run: |
          set -euo pipefail
          allow="scripts/release/gnu-ldd-allowlist.txt"
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            f="target/$t/release/irontraffic"
            echo "== $t =="
            if [ "$t" = "x86_64-unknown-linux-gnu" ]; then
              libs="$(ldd "$f" | awk '{print $1}')"
            else
              # A foreign-architecture DYNAMIC binary cannot be resolved by
              # this runner's own ldd/ld.so (unlike the static case above),
              # so its NEEDED entries are read straight out of the ELF
              # dynamic section instead of executing anything.
              libs="$(readelf -d "$f" | awk -F'[][]' '/\(NEEDED\)/{print $2}')"
            fi
            # Compare SONAMEs, not paths, and report EVERY violation.
            #
            # `ldd` prints the program interpreter as a bare absolute path with
            # no `=>` (`/lib64/ld-linux-x86-64.so.2`), while every other line
            # starts with a SONAME. Taking `$1` verbatim therefore produced a
            # path for exactly one line, which matched nothing in an allowlist
            # written in SONAMEs, and the first pull request run of this job
            # failed on it:
            #
            #   FAIL: x86_64-unknown-linux-gnu links /lib64/ld-linux-x86-64.so.2
            #
            # The allowlist already contained `ld-linux-x86-64.so.2`. Adding the
            # absolute path instead would have pinned this runner's own
            # multiarch layout, which differs across distributions, so the
            # basename is what is compared.
            #
            # Violations are also collected rather than exited on, because the
            # previous form died inside a pipeline subshell on the first one and
            # so could only ever name a single library per run.
            bad=""
            for lib in $libs; do
              [ -n "$lib" ] || continue
              base="${lib##*/}"
              if ! grep -qxF "$base" "$allow"; then
                bad="$bad $t:$base"
              fi
            done
            if [ -n "$bad" ]; then
              echo "FAIL: not in $allow:"
              for entry in $bad; do echo "  $entry"; done
              echo "full ldd/readelf output for $t:"
              printf '%s\n' "$libs"
              exit 1
            fi
          done
          echo "allowlist: ok"
      - name: Create the GitHub release
        # Tag only. On a pull request every step above has already run, so the
        # artifacts are built and checked; there is simply no release to attach
        # them to, and this job holds `contents: write`, which a pull request
        # must never exercise.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # scripts/install.sh is uploaded here too, not only the tarballs and
          # the checksum manifest: docs/QUICKSTART.md (itself shipped inside
          # every tarball), docs/RELEASE.md, and install.sh's own header
          # comment all advertise
          # ".../releases/latest/download/install.sh" as the one-line
          # install command, and that URL 404s unless install.sh is itself a
          # release asset. `gh release create` uploads an asset under its
          # base filename by default, so `scripts/install.sh` here lands at
          # exactly the advertised path.
          #
          # scripts/release/verify.sh and scripts/release/sbom-licence-check.sh
          # are uploaded the same way and for the identical reason
          # (release-sbom-signing-and-provenance, #428):
          # `scripts/install.sh` downloads and runs verify.sh from this same
          # release, and docs/SUPPLY-CHAIN.md documents downloading and
          # running it standalone, neither of which works unless it is
          # itself a release asset. The SBOMs, signatures (`.bundle` per
          # file, a self-contained Sigstore bundle: signature, certificate
          # and Rekor inclusion proof together, chosen over a bare
          # signature plus a live Rekor search; see sign.sh's own comment)
          # and provenance attestations (`.intoto.bundle`) glob in
          # alongside the tarballs and SHA256SUMS they cover.
          # `dist/*.bundle` is NOT used here on its own: it would also
          # match every `*.intoto.bundle` (a glob's `*` matches dots), which
          # made `gh release create` see the same attestation file twice,
          # once per pattern. Each glob below is specific enough to match
          # exactly the file kind it names and no other.
          gh release create "$tag" \
            dist/*.tar.gz dist/*.sbom.json dist/SHA256SUMS \
            dist/*.tar.gz.bundle dist/*.sbom.json.bundle dist/SHA256SUMS.bundle \
            dist/*.intoto.bundle \
            scripts/install.sh scripts/release/verify.sh scripts/release/sbom-licence-check.sh \
            --title "$tag" --generate-notes
