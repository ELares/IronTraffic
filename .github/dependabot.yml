version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The @1.89 reference IS the MSRV policy, not a dependency version. MSRV
      # bumps are deliberate pull requests with a changelog entry.
      - dependency-name: dtolnay/rust-toolchain
